<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CIRCLE CRIME || ALL BASE</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: 'Anton', sans-serif;
      background: linear-gradient(135deg, #000000, #550000);
      color: #ffffff;
      padding: 20px;
      text-align: center;
      text-transform: uppercase;
      position: relative;
      overflow-x: hidden;
      cursor: pointer;
      user-select: none;
    }

    h1, .section, .player-box {
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 3px 3px 6px #000;
      letter-spacing: 1px;
    }

    .section {
      margin-top: 2.5rem;
    }

    .section h2 {
      color: #ffcc00;
      font-size: 2rem;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 4px #000;
    }

    .list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 100%;
      padding: 0 10px;
    }

    .list span,
    .list strong {
      padding: 0.6rem 1rem;
      background-color: rgba(255, 77, 136, 0.25);
      border: 2px solid #ff4d88;
      border-radius: 12px;
      font-size: 1rem;
      color: #fff;
      text-shadow: 2px 2px 4px #000;
      letter-spacing: 1px;
      word-break: break-word;
    }

    .player-box {
      border: 3px solid #ff4d88;
      border-radius: 20px;
      padding: 20px;
      background-color: rgba(255, 77, 136, 0.1);
      max-width: 100%;
      overflow-wrap: break-word;
    }

    /* Teks pop-up di posisi klik */
    .popup-text {
      position: fixed;
      font-size: 1.8rem;
      color: #ff4d88;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 6px 14px;
      border-radius: 12px;
      text-shadow: 2px 2px 6px #000;
      opacity: 1;
      pointer-events: none;
      user-select: none;
      animation: popup-rise-fade 1.5s ease-out forwards;
      white-space: nowrap;
      transform-origin: center;
      z-index: 9999;
    }

    @keyframes popup-rise-fade {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      20% {
        opacity: 1;
        transform: translateY(0);
      }
      80% {
        opacity: 1;
        transform: translateY(-10px);
      }
      100% {
        opacity: 0;
        transform: translateY(-20px);
      }
    }
  </style>
</head>
<body onclick="showPopup(event)">

  <h1>CIRCLE CRIME || ALL BASE</h1>

  <div class="section">
    <h2>LEADERSHIP 👑</h2>
    <div class="list">
      <strong>LEADER CIRCLE CRIME -</strong> <span>BENZ</span>
    </div>
  </div>

  <div class="section">
    <h2>4KAISAR 🌟</h2>
    <div class="list">
      <span>JACK</span>
      <span>MURSID</span>
      <span>AFIQ</span>
      <span>LEVI</span>
    </div>
  </div>

  <div class="section">
    <h2>MODERATOR CRIME 🔵</h2>
    <div class="list">
      <span>YINN</span>
    </div>
  </div>

  <div class="section">
    <h2>ALL PLAYERS ⭐</h2>
    <div class="player-box">
      <div class="list">
        <span>JACK</span><span>MURSID</span><span>WENNFF</span><span>CHILL</span>
        <span>MASDO</span><span>YINN</span><span>LEVI</span><span>RIZZ</span>
        <span>MAN</span><span>AZNIL</span><span>SAJID</span><span>MILO</span>
        <span>BOYY</span><span>MIEYY</span><span>RAJA</span><span>PIZI</span>
        <span>LEFFY</span><span>GERI</span><span>SADZ</span><span>JIB</span>
        <span>MINZ</span><span>JIM</span><span>BAL</span><span>AISH</span>
        <span>PAN</span><span>AZEL</span><span>YANZO</span><span>DAMZ</span>
        <span>LADI</span><span>LANAU</span>
      </div>
    </div>
  </div>

  <script>
    const texts = [
      "CIRCLE CRIME ONTOP",
      "JACK HENSEM",
      "KING MURSID",
      "BENZ JAGOAN FF",
      "RIZZ WIKWIK",
      "BOYY NUB",
      "MIEYY❤RAJAA",
      "CIRCLE CRIME ALWAYS NUMBER 1",
      "EMANG KITA SETARA ?",
      "BENZ ONTOP",
      "MATI AJA PLAYER SPEK MURAH",
      "AFFAH IYA DEKK"
    ];

    function showPopup(event) {
      const popup = document.createElement('div');
      popup.className = 'popup-text';

      // Pilih teks secara rawak dari array
      const randomIndex = Math.floor(Math.random() * texts.length);
      popup.textContent = texts[randomIndex];

      // Dapatkan posisi klik
      const x = event.clientX;
      const y = event.clientY;

      // Tetapkan posisi popup (sedikit adjust supaya popup tepat di atas klik)
      popup.style.left = `${x}px`;
      popup.style.top = `${y}px`;

      document.body.appendChild(popup);

      // Buang elemen selepas animasi habis (1.5s)
      setTimeout(() => {
        popup.remove();
      }, 1500);
    }
  </script>

</body>
</html>
